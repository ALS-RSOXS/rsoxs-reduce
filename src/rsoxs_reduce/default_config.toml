# Bundled fallback configuration template.
#
# The CLI uses a config file in this order:
#   1. the path given to --config
#   2. ./reduction_config.toml in the current working directory
#   3. this bundled default
#
# Copy this to `reduction_config.toml` next to your data, replace the placeholder
# paths, and fill in the [samples] map for your beamtime. On Windows use
# single-quoted TOML literal strings for paths, e.g. 'C:\data\scan'.

[paths]
data_path = "path/to/beamtime/data"
fits_subdir = "fits"
dark_subdir = "fits"
i0_path = "path/to/i0.txt"
i1_path = "path/to/i1.txt"   # omit this line, or set to "" or "none", to reduce without the I1 correction
mask_path = "path/to/mask.hdf"
results_root = "results"

[loader]
corr_mode = "als"
exposure_offset = 0.0
data_collected_after_mar2021 = true
dark_subtract = true
dark_pedestal = 200

[geometry]
ni_distance = 0.0
ni_bcx = 0.0
ni_bcy = 0.0
ni_tiltx = 0.0
ni_tilty = 0.0
tilt_units = "degrees"   # unit of ni_tiltx/ni_tilty: "degrees" (default) or "radians"
ni_pixsize_x = 0.0096
ni_pixsize_y = 0.0096

[reduction]
integration_method = "csr"
polarization = "0"
energy_match_decimals = 1
# Only reduce these energies (eV), matched to energy_match_decimals. Empty or
# omitted = all energies. The --energy CLI option overrides this list.
energies = []            # e.g. [285.2, 286.0, 287.5]
# q_min = 0.001   # uncomment to bound the ISI integral
# q_max = 0.05

[plotting]
detector_vmin = 1e-3
detector_vmax = 1e5
detector_dpi = 72
plot_dpi = 150
waterfall_factor = 10.0
colormap = "viridis"

[processing]
# Energies to load and reduce per batch, to bound peak memory on large scans.
# 0 (default) loads and reduces the whole scan at once. Results are identical
# either way; batching only changes how many raw images are resident at once.
# Override on the command line with --batch-size.
batch_size = 0

[output]
# The chi-averaged I(q, E) .dat and plots are always produced. Everything below
# is additive and off by default.
#
# Chi slices: additional azimuthal wedges added as columns to Ivsq.dat and as
# curves on the Ivsq plots. Give center angles (deg); empty = chi-average only.
chi_slices = []            # e.g. [0, 90]
chi_width = 5.0            # half-width per slice in deg (+/- around each center)
#
# Anisotropy A(q, E) via PyHyperScattering's AR = (I_para - I_perp)/(I_para + I_perp),
# with para = chi 0 deg and perp = chi -90 deg, both using chi_width above.
anisotropy = false             # write {sample}_Avsq.dat
anisotropy_plot = false        # plot A(q, E), all energies overlaid, y in [-1, 1]
integrated_anisotropy = false  # write + plot integral A(q,E) dq vs energy (uses q_min/q_max)
#
# Full I(q, chi) per energy.
iqchi_dat = false          # write 2D q x chi .dat per energy under iqchi/
iqchi_plot = false         # write 2D q x chi heatmap per energy under iqchi/

[md_filter]
"CCD Camera Shutter Inhibit" = 0

# Map scan numbers to sample names for your beamtime, e.g.:
[samples]
# 12345 = "SampleA_ESCAN"
