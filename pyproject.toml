[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rsoxs-reduce"
version = "0.1.0"
description = "Command-line ALS 11.0.1.2 RSoXS energy-scan reduction built on PyHyperScattering."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TJ Ferron", email = "tjferron@lbl.gov" }]
keywords = ["RSoXS", "ALS", "scattering", "PyHyperScattering", "beamline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyHyperScattering @ git+https://github.com/ALS-RSOXS/PyHyperScattering.git@main",
    "matplotlib==3.11.0",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "tomli-w==1.2.0",
    "typer==0.26.8",
    "xarray==2026.4.0",
]

[project.urls]
Homepage = "https://github.com/ALS-RSOXS/rsoxs-reduce"
Repository = "https://github.com/ALS-RSOXS/rsoxs-reduce"
Issues = "https://github.com/ALS-RSOXS/rsoxs-reduce/issues"

[project.scripts]
rsoxs-reduce = "rsoxs_reduce.reduce:cli"

[dependency-groups]
dev = ["pytest==9.1.1"]

# Allow the git-URL dependency (PyHyperScattering from the ALS-RSOXS fork).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rsoxs_reduce"]
